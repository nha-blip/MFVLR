generator: FaceSwapper
category: FS
architecture: GAN
target_count: 30000
array_chunk_size: 1000
native_resolution:
- 256
- 256
final_resolution:
- 224
- 224
slurm:
  time_per_chunk: 00:20:00
  vram_mb: 1024
  gpus: 1
  conda_env: mfvlr_a100
sampling:
  generator_checkpoint: checkpoints/FS/FaceSwapper/faceswapper.ckpt
  arcface_checkpoint: checkpoints/FS/FaceSwapper/model_ir_se50.pth
  wing_checkpoint: checkpoints/FS/FaceSwapper/wing.ckpt
  pair_manifest: manifests/faceswapper_pairs_30k.csv
prompts:
  L1: A photo of a fake face
  L2: A photo of an identity swapped face
  L3: A photo generated by the gan-based model
  L4: The source generative model of this photo is FaceSwapper
