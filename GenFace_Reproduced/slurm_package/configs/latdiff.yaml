generator: LatDiff
category: EFS
architecture: Diffusion
target_count: 60000
array_chunk_size: 500
native_resolution:
- 256
- 256
final_resolution:
- 224
- 224
slurm:
  time_per_chunk: 00:45:00
  vram_mb: 3072
  gpus: 1
  conda_env: mfvlr_a100
sampling:
  checkpoint: checkpoints/EFS/LatDiff/ffhq_ldm_kl_f4.ckpt
  config: configs/ldm_ffhq_kl4.yaml
