    category: EFS
    architecture: Diffusion
    repository: "https://github.com/paho/diffusion-models-pytorch"
    checkpoint_url: "https://heibox.uni-heidelberg.de/f/6231d6044d034ba2847a/?dl=1"
    filename: "celeba_ddpm.pt"
    sha256: null
    manual_instructions: "Official/community CelebA DDPM checkpoint."

