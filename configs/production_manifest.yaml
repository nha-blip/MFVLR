    native_resolution: "256x256"
    final_resolution: "224x224"
    pairing:
      protocol: "CelebA bidirectional pairing"
      pristine_pool_size: 30000
      partition_a_size: 15000
      partition_b_size: 15000
      rule: "A[i] identity -> B[i] context (mask ref B[i]), B[i] identity -> A[i] context (mask ref A[i])"
      total_pairs: 30000
    seed_policy: "deterministic (seed = pair_idx)"
    mask_policy: "abs(fake - target_context) > 0.1 BT.601, uint8 {0, 255}"
    provenance:
      official_repo: "VERIFIED"
      architecture: "VERIFIED"
      checkpoint: "VERIFIED"
      source_domain: "VERIFIED"
      pairing_protocol: "INFERRED"
      mask_policy: "VERIFIED"
    notes: "Switched from FF++ validation test to CelebA bidirectional pairing (15k x 2 = 30k swaps). Mask reference is strictly the target context face."
