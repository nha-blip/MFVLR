# ==============================================================================
# MFVLR / GenFace-Reproduced: Master Production Dataset Manifest
# Target Pool: 375,000 Fake Images across 8 Verified OFFICIAL_READY Generators
# Split Policy: All samples initially set to split = UNASSIGNED
# ==============================================================================

version: "1.0.0"
date: "2026-09-20"
total_target_samples: 375000
default_split: "UNASSIGNED"
final_resolution: "224x224"
mask_format: "PNG uint8 {0, 255}, BT.601 luminance diff > 0.1, no morphology"

blocked_generators:
  - name: "DiffFace"
    category: "FS"
    architecture: "Diffusion"
    status: "BLOCKED / MANUAL_DOWNLOAD_REQUIRED"
    reason: "Official checkpoint download URL inaccessible/requires manual authentication"
    substitution_policy: "STRICTLY FORBIDDEN (No mock, surrogate, or synthetic replacement)"
  - name: "FSLSD"
    category: "FS"
    architecture: "GAN"
    status: "BLOCKED / MANUAL_DOWNLOAD_REQUIRED"
    reason: "Official checkpoint weights unavailable without manual author retrieval"
    substitution_policy: "STRICTLY FORBIDDEN (No mock, surrogate, or synthetic replacement)"

generators:
  # ----------------------------------------------------------------------------
  # Entire Face Synthesis (EFS)
  # ----------------------------------------------------------------------------
  DDPM:
    category: "EFS"
    architecture: "Diffusion"
    target_count: 50000
    official_repo: "https://huggingface.co/google/ddpm-celebahq-256"
    git_commit: "cd5c944777ea2668051904ead6cc120739b86c4d"
    checkpoint: "google/ddpm-celebahq-256"
    checkpoint_sha256: "6b81d77cb077d018788417c88b4ddc89a7444c1dcae9e0350a4ec9ec51787c8d"
    source_domain: "CelebA-HQ"
    native_resolution: "256x256"
    final_resolution: "224x224"
    sampling:
      scheduler: "DDIM"
      timesteps: 50
      eta: 0.0
    seed_policy: "deterministic (seed = sample_idx)"
    mask_policy: "all_255 (ratio = 1.0)"
    provenance:
      official_repo: "VERIFIED"
      architecture: "VERIFIED"
      checkpoint: "INFERRED"
      source_domain: "VERIFIED"
      sampling: "INFERRED"
      native_resolution: "VERIFIED"
      mask_policy: "VERIFIED"
    notes: "Uses Hugging Face official google/ddpm-celebahq-256 checkpoint with DDIM 50-step acceleration for scalable SLURM production."

